name: Cubical Compare Debian CLI Portable
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Windows source branch, tag or commit (blank uses builder checkout)
        type: string
        default: windows/main-preview
      version:
        description: Optional product version override
        type: string
        default: ''
      channel:
        type: choice
        options: [auto, preview, stable]
        default: auto
      revision:
        description: Debian packaging revision
        type: string
        default: '1'
  push:
    branches: [linux/debian-cli]
    paths:
      - 'linux-cli/**'
      - 'windows/CubicalCompare/Core/**'
      - '.github/workflows/debian-cli.yml'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      ref: ${{ steps.meta.outputs.ref }}
      sdk: ${{ steps.meta.outputs.sdk }}
      app_version: ${{ steps.meta.outputs.app_version }}
      channel: ${{ steps.meta.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          path: windows-source
      - id: meta
        env:
          SOURCE_REF: ${{ inputs.source_ref || github.ref_name }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel || 'auto' }}
          REVISION: ${{ inputs.revision || '1' }}
        run: |
          args=(--source windows-source --source-ref "$SOURCE_REF" --channel "$CHANNEL" --revision "$REVISION")
          if [[ -n "$VERSION" ]]; then args+=(--version "$VERSION"); fi
          python3 linux-cli/sync-upstream.py "${args[@]}"
          python3 - <<'PY'
          import json,os
          m=json.load(open('linux-cli/src/upstream.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              for k,v in [('sha',m['source_sha']),('ref',m['source_ref']),('sdk',m['sdk']),('app_version',m['app_version']),('channel',m['channel'])]:
                  print(f'{k}={v}',file=f)
          PY
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: windows-source
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.prepare.outputs.sdk }}
      - name: Build selected version
        env:
          SOURCE_REF: ${{ needs.prepare.outputs.ref }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel || 'auto' }}
          REVISION: ${{ inputs.revision || '1' }}
        run: |
          args=(--source "$PWD/windows-source" --source-ref "$SOURCE_REF" --channel "$CHANNEL" --revision "$REVISION")
          if [[ -n "$VERSION" ]]; then args+=(--version "$VERSION"); fi
          bash linux-cli/build-debian.sh '${{ matrix.arch }}' "${args[@]}"
      - name: Debian 12 and 13 portable smoke tests
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.app_version }}
        run: |
          for version in 12 13; do
            docker run --rm -e EXPECTED_VERSION -v "$(realpath linux-cli):/src:ro" "debian:$version" bash -ec '
              apt-get update
              apt-get install -y python3 ca-certificates ffmpeg libfontconfig1 libfreetype6 libc6 libgcc-s1 libstdc++6 zlib1g fonts-dejavu-core
              if grep -q "^VERSION_ID=\"13\"" /etc/os-release; then
                apt-get install -y libicu76 libssl3t64
              else
                apt-get install -y libicu72 libssl3
              fi
              mkdir -p /tmp/cc-portable
              tar -xzf /src/dist/*-portable.tar.gz -C /tmp/cc-portable
              cli=/tmp/cc-portable/cubical-compare/cubical-compare
              test -x "$cli"
              test "$("$cli" --version)" = "$EXPECTED_VERSION"
              bash /src/tests/smoke.sh "$cli"
            '
          done
      - uses: actions/upload-artifact@v4
        with:
          name: debian-${{ matrix.arch }}
          path: |
            linux-cli/dist/*-portable.tar.gz
            linux-cli/dist/SHA256SUMS-*.txt
            linux-cli/dist/UPSTREAM-*.json
          if-no-files-found: error
  release:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: debian-*
          path: dist
          merge-multiple: true
      - name: Publish tested binaries
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS-amd64.txt
          sha256sum -c SHA256SUMS-arm64.txt
          python3 - <<'PY'
          import json
          a=json.load(open('UPSTREAM-amd64.json'))
          b=json.load(open('UPSTREAM-arm64.json'))
          assert a == b, 'Architecture source/version mismatch'
          PY
          # Always mark this experimental port as prerelease even for stable Windows sources.
          gh release create "v${APP_VERSION}.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" ./*-portable.tar.gz ./SHA256SUMS-*.txt ./UPSTREAM-*.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Cubical Compare $APP_VERSION" --notes "Windows source: $SOURCE_SHA ($CHANNEL). AMD64 and ARM64 portable archives passed Debian 12/13 smoke tests. Pixel parity is not certified." --prerelease
